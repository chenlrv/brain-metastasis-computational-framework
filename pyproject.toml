[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis_research"
version = "1.0.0"
description = "Analysis code for the MSc thesis 'Supervised Tumor-Cell Identification and Data-Quality Assessment in Spatial Transcriptomics of Brain Metastasis'"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["thesis_research*"]
